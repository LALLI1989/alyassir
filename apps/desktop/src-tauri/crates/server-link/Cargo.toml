[package]
name = "server-link"
version = "0.1.0"
edition = "2021"
description = "HTTPS and Socket.IO link to the Alyassir server, pinned by certificate fingerprint."

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "time", "rt", "macros", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
