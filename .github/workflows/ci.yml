name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One-time bootstrap: lockfiles cannot be created on the development machine,
  # so CI creates them once and commits them to the branch.
  lockfiles:
    name: Create missing lockfiles
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          missing=0
          [ -f pnpm-lock.yaml ] || missing=1
          [ -f apps/desktop/src-tauri/Cargo.lock ] || missing=1
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.missing == '1'
        uses: pnpm/action-setup@v4
      - if: steps.check.outputs.missing == '1'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.check.outputs.missing == '1'
        run: |
          [ -f pnpm-lock.yaml ] || pnpm install --lockfile-only
          [ -f apps/desktop/src-tauri/Cargo.lock ] || (cd apps/desktop/src-tauri && cargo generate-lockfile)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/desktop/src-tauri/Cargo.lock
          git commit -m "Add dependency lockfiles (generated by CI)"
          git push

  tests:
    name: Server and app tests (real PostgreSQL 16)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alyassir
          POSTGRES_PASSWORD: alyassir
          POSTGRES_DB: alyassir_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alyassir"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://alyassir:alyassir@127.0.0.1:5432/alyassir_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=${{ hashFiles('pnpm-lock.yaml') != '' }}
      - run: pnpm -r typecheck
      - run: pnpm --filter @alyassir/server build
      - run: pnpm -r test
      - name: Desktop connection logic (Rust unit tests)
        working-directory: apps/desktop/src-tauri
        run: cargo test -p server-link ${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') != '' && '--locked' || '' }}

  windows-installer:
    name: Build installer and test it on clean Windows
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-win-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-win-
      - run: pnpm install --frozen-lockfile=${{ hashFiles('pnpm-lock.yaml') != '' }}
      - name: Build server
        run: pnpm --filter @alyassir/server build
      - name: Build desktop app
        run: pnpm --filter @alyassir/desktop tauri build --no-bundle ${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') != '' && '-- --locked' || '' }}
      - name: Download bundled programs (Node.js, PostgreSQL 16, WinSW)
        shell: pwsh
        run: ./installer/scripts/fetch-vendor.ps1
      - name: Build installer
        shell: pwsh
        run: ./installer/scripts/stage.ps1 -Version 0.0.1
      - uses: actions/upload-artifact@v4
        with:
          name: Alyassir-Setup
          path: installer/output/*.exe
          retention-days: 30
      - name: Test installer end to end
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer/output/*.exe | Select-Object -First 1).FullName
          ./installer/tests/e2e.ps1 -Setup $setup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-test-logs
          path: ${{ runner.temp }}/alyassir-logs
          retention-days: 14
