name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Lockfiles cannot be produced on the development machine (no package registry there),
  # so CI keeps them up to date and commits them to the branch.
  lockfiles:
    name: Update lockfiles
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfiles (adds new packages, keeps existing versions)
        run: |
          pnpm install --lockfile-only
          (cd apps/desktop/src-tauri && cargo metadata --format-version 1 > /dev/null)
      - name: Commit if changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml apps/desktop/src-tauri/Cargo.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml apps/desktop/src-tauri/Cargo.lock
          git commit -m "Update dependency lockfiles (generated by CI)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  tests:
    name: Server and app tests (real PostgreSQL 16)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: alyassir
          POSTGRES_PASSWORD: alyassir
          POSTGRES_DB: alyassir_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alyassir"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://alyassir:alyassir@127.0.0.1:5432/alyassir_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: tooling/ci-run.sh install pnpm install --no-frozen-lockfile
      - name: Dependency boundaries
        if: ${{ !cancelled() }}
        run: tooling/ci-run.sh boundaries node tooling/check-boundaries.mjs
      - name: Build packages
        run: tooling/ci-run.sh build pnpm turbo run build --filter=@alyassir/server...
      - name: Type check
        if: ${{ !cancelled() }}
        run: tooling/ci-run.sh typecheck pnpm turbo run typecheck --continue
      # Backups and restore are tested with the real pg_dump / pg_restore of PostgreSQL 16 (Phase 6B).
      - name: PostgreSQL 16 tools
        run: |
          sudo apt-get install -y -q postgresql-client-16 >/dev/null
          echo "ALYASSIR_TEST_PG_BIN=/usr/lib/postgresql/16/bin" >> "$GITHUB_ENV"
          /usr/lib/postgresql/16/bin/pg_dump --version
      - name: Tests (server on real PostgreSQL, packages, app)
        if: ${{ !cancelled() }}
        run: tooling/ci-run.sh tests pnpm turbo run test --concurrency=1 --continue
      - name: Interface tests in a browser (Playwright)
        if: ${{ !cancelled() }}
        working-directory: apps/desktop
        run: |
          pnpm exec playwright install --with-deps chromium
          ../../tooling/ci-run.sh playwright pnpm exec playwright test
      - name: Browser demo for GitHub Codespaces starts and answers
        if: ${{ !cancelled() }}
        run: tooling/ci-run.sh demo tooling/demo/smoke.sh
      # Screenshots of the real interface, published on the "screenshots" branch for the owner.
      - name: Publish screenshots
        if: ${{ success() && github.event_name == 'push' }}
        run: |
          [ -d apps/desktop/screenshots ] || exit 0
          cp -r apps/desktop/screenshots "$RUNNER_TEMP/shots"
          cd "$RUNNER_TEMP/shots"
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Interface screenshots from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" screenshots
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/desktop/test-results
          retention-days: 7
      - name: Desktop connection logic (Rust unit tests)
        if: ${{ !cancelled() }}
        working-directory: apps/desktop/src-tauri
        run: ../../../tooling/ci-run.sh rust cargo test -p server-link

  # The browser demo, started exactly as GitHub Codespaces starts it (same container files).
  codespaces-demo:
    name: Codespaces demo starts like on GitHub Codespaces
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the demo container and check it answers
        run: tooling/ci-run.sh codespaces tooling/demo/devcontainer-check.sh

  windows-installer:
    name: Build installer and test it on clean Windows
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-win-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-win-
      - run: pnpm install --no-frozen-lockfile
      - name: Build server
        shell: bash
        run: tooling/ci-run.sh build-server pnpm turbo run build --filter=@alyassir/server...
      - name: Build desktop app
        shell: bash
        run: tooling/ci-run.sh build-desktop pnpm --filter @alyassir/desktop tauri build --no-bundle
      - name: Download bundled programs (Node.js, PostgreSQL 16, WinSW)
        shell: pwsh
        run: ./installer/scripts/fetch-vendor.ps1
      - name: Build installer
        shell: pwsh
        run: ./installer/scripts/stage.ps1 -Version 0.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: Alyassir-Setup
          path: installer/output/*.exe
          retention-days: 30
      # The Phase 7 installer, to test updating a server installed by the previous phase.
      - name: Download the previous installer (Phase 7)
        id: previous
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Alyassir-Setup
          run-id: 40921552257
          github-token: ${{ github.token }}
          path: installer/previous
      - name: Test installer end to end
        shell: pwsh
        run: |
          $setup = (Get-ChildItem installer/output/*.exe | Select-Object -First 1).FullName
          $previous = (Get-ChildItem installer/previous/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $previous) { Write-Host "::warning title=Update test::Phase 7 installer not available; update-from-Phase-7 scenario skipped" }
          ./installer/tests/e2e.ps1 -Setup $setup -PreviousSetup "$previous"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-test-logs
          path: ${{ runner.temp }}/alyassir-logs
          retention-days: 14

  # Phase 8A: a permanent download link for the owner (no sign-in, no expiry), after every
  # successful merge into main: https://github.com/<repo>/releases/latest/download/Alyassir-Setup.exe
  release:
    name: Publish the installer (GitHub Releases)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, windows-installer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Alyassir-Setup
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exe=$(ls dist/*.exe | head -n 1)
          cp "$exe" Alyassir-Setup.exe
          tag="v0.1.0-${GITHUB_SHA::7}"
          gh release create "$tag" Alyassir-Setup.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Alyassir ${tag}" \
            --notes "المثبّت الكامل (الخادم وحواسيب المستخدمين والتحديث والاستعادة). Installateur complet (serveur, postes, mise à jour, restauration). Commit ${GITHUB_SHA::7}."
