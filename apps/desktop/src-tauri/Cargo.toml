[package]
name = "alyassir-desktop"
version = "0.1.0"
edition = "2021"
description = "Alyassir desktop client"

[workspace]
members = [".", "crates/server-link"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
server-link = { path = "crates/server-link" }
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
